name: CI Tests

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ vars.BASE_URL }}
      SAUCEDEMO_STANDARD_USERNAME: ${{ secrets.SAUCEDEMO_STANDARD_USERNAME }}
      SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
      SAUCEDEMO_INVALID_USERNAME: ${{ secrets.SAUCEDEMO_INVALID_USERNAME }}
      SAUCEDEMO_LOCKED_OUT_USERNAME: ${{ secrets.SAUCEDEMO_LOCKED_OUT_USERNAME }}
      SAUCEDEMO_FIRST_NAME: ${{ secrets.SAUCEDEMO_FIRST_NAME }}
      SAUCEDEMO_LAST_NAME: ${{ secrets.SAUCEDEMO_LAST_NAME }}
      SAUCEDEMO_POSTAL_CODE: ${{ secrets.SAUCEDEMO_POSTAL_CODE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests with report
        continue-on-error: true
        run: npm run test

      - name: Generate Playwright summary
        if: always()
        run: |
          echo "## 🧪 Automated Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "" Author: ${{ github.actor }} >> $GITHUB_STEP_SUMMARY
          echo "- Commit: https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "- Total: $(jq '.stats.total' playwright-results.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Passed: $(jq '.stats.expected' playwright-results.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Failed: $(jq '.stats.unexpected' playwright-results.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Skipped: $(jq '.stats.skipped' playwright-results.json)" >> $GITHUB_STEP_SUMMARY
          

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Comment Playwright summary on PR
        if: always () && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const results = JSON.parse(fs.readFileSync('playwright-results.json', 'utf8'));
            const stats = results.stats;
            const author = context.actor;

            const commitSha = context.sha;
            const repo = context.repo;

            const commitUrl = `https://github.com/${repo.owner}/${repo.repo}/commit/${commitSha}`;

            const passed = stats.expected || 0;
            const failed = stats.unexpected || 0;
            const skipped = stats.skipped || 0;
            const flaky = stats.flaky || 0;
            const total = passed + failed + skipped + flaky;

            const body = `## 🧪 Automated Test Summary

            🔗 Commit: ${commitUrl}
            👤 Commit Author: ${author}

            | Status | Count |
            | ------ | ----- |
            | 📊 Total | ${total} |
            | ✔️ Passed | ${passed} |
            | ❌ Failed | ${failed} |
            | ⚠️ Flaky | ${flaky} |
            | ⏭️ Skipped | ${skipped} |

            _Generated automatically by GitHub Actions._`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });